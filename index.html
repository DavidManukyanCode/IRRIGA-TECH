<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Irriga Tech</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Armenian:wght@400;500;600;700&family=Noto+Serif+Armenian:wght@500;600&display=swap">
<style>
/* Layout: light web app. White header with tabs; dashboard = field scene + plan on the left, action and readings on the right; one light look on purpose */
:root{
  color-scheme:light;
  --bg:#F7F9F6; --surface:#FFFFFF; --soft:#EEF4EC; --line:#E1E8DE;
  --ink:#17301F; --muted:#647469;
  --green:#1F7A45; --green-2:#2E9A57; --leaf:#6AAE3A;
  --water:#1E7FC0; --water-soft:#E4F0FA;
  --warn:#B97E10; --warn-soft:#FBF1DC; --bad:#C4452D; --bad-soft:#FBE7E2; --good-soft:#E3F2E6;
  --gold:#D9A93A; --silver:#A8B3BA; --bronze:#C08457;
  --f-display:'Fraunces','Noto Serif Armenian',Georgia,serif;
  --f-body:'Manrope','Noto Sans Armenian',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-0.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.label{font-size:.75rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--water);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;min-height:66px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:42px;height:42px;border-radius:50%}
.brand b{font-family:var(--f-body);font-weight:800;font-size:1.15rem;letter-spacing:.04em;color:var(--green)}
.brand b span{color:var(--water)}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.nav a:hover{color:var(--ink);background:var(--soft)}
.nav a[aria-current="page"]{color:var(--green);background:var(--good-soft)}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0;padding:3px;gap:2px}
.lang button{border:0;background:transparent;padding:5px 11px;font-weight:800;font-size:.8rem;cursor:pointer;color:var(--muted);border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--green);color:#fff}
@media (max-width:760px){.nav{order:3;flex-basis:100%}}

.page{padding-block:28px 64px;display:grid;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:.85rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(23,48,31,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer;border:0;background:var(--green);color:#fff}
.btn.light{background:#fff;color:var(--green)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:800}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.dry{background:var(--bad-soft);color:var(--bad)}
.pill.watch{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--good-soft);color:var(--green)}
.demo{font-size:.78rem;color:var(--muted)}

/* dashboard */
.hello{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.hello h1{font-size:clamp(1.8rem,3.6vw,2.5rem)}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:940px){.dash{grid-template-columns:1fr}}
.col{display:grid;gap:20px;min-width:0}
.scene-card{padding:0;overflow:hidden}
.scene{position:relative}
.scene canvas{display:block;width:100%}
.scene .tag{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.92);border-radius:12px;padding:8px 12px;font-weight:800;font-size:.85rem;display:flex;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.scene .tag i{width:9px;height:9px;border-radius:50%;background:var(--water);animation:blink 1.6s infinite}
.scene .tag.off i{background:var(--muted);animation:none}
@keyframes blink{50%{opacity:.3}}
.scene .reads{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.scene .reads span{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.scene-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap;border-top:1px solid var(--line)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto minmax(0,1.1fr);gap:10px;align-items:stretch}
.flow .f{background:var(--soft);border-radius:16px;padding:12px 14px;display:grid;gap:2px;align-content:start}
.flow .f b{font-size:1rem}
.flow .f.res{background:var(--good-soft)}
.flow .f.res b{color:var(--green)}
.flow .arrow{display:grid;place-items:center;color:var(--muted);font-weight:800}
@media (max-width:640px){.flow{grid-template-columns:1fr 1fr}.flow .arrow{display:none}.flow .f.res{grid-column:1/-1}}
.action{background:linear-gradient(140deg,#1F7A45 0%,#2E9A57 60%,#3A9E7A 100%);color:#fff;border:0;display:grid;gap:10px}
.action .label{color:rgba(255,255,255,.75)}
.action h2{font-size:1.75rem;font-weight:500}
.action .sub{color:rgba(255,255,255,.88)}
.action .why{justify-self:start;background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:7px 12px;font-weight:800;font-size:.82rem;cursor:pointer}
.action ul{margin:0;padding-left:18px;display:grid;gap:4px;color:rgba(255,255,255,.9);font-size:.88rem}
.moist{display:grid;gap:12px}
.moist .big{font-family:var(--f-display);font-size:3rem;line-height:1}
.moist .big small{font-size:1.2rem;color:var(--muted)}
.mbars{display:flex;align-items:flex-end;gap:5px;height:56px}
.mbars i{flex:1;border-radius:4px;background:var(--water-soft)}
.mbars i.cur{background:var(--water)}
.depths{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.depths div{background:var(--soft);border-radius:14px;padding:10px 12px}
.depths b{font-size:1.25rem}
.wx-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.wx-d{border-radius:14px;padding:8px 4px;text-align:center;display:grid;gap:2px;justify-items:center;font-size:.8rem}
.wx-d.hl{background:var(--water-soft)}
.wx-d svg{width:28px;height:28px}
.wx-d b{font-size:.85rem}
.wx-note{margin-top:12px;font-size:.85rem;background:var(--water-soft);border-radius:12px;padding:10px 12px}
.wx-now{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wx-now .t{font-family:var(--f-display);font-size:2.2rem;line-height:1}
.pool-row{display:flex;gap:14px;align-items:center}
.ptank{width:54px;height:64px;border:2px solid var(--water);border-radius:12px;position:relative;overflow:hidden;flex-shrink:0}
.ptank i{position:absolute;left:0;right:0;bottom:0;background:var(--water);opacity:.85}
.chart svg{width:100%;height:auto;display:block}
.call{display:grid;gap:12px}
.call .row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,.8fr);gap:8px}
@media (max-width:520px){.call .row{grid-template-columns:1fr}}
.call input,.call select{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);width:100%;min-width:0}
.note{border-radius:14px;padding:12px 14px;background:var(--good-soft);font-size:.88rem}
.script{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:.88rem}

/* guides */
.guides{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:940px){.guides{grid-template-columns:1fr}}
.vids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:640px){.vids{grid-template-columns:1fr}}
.vid{display:grid;gap:8px}
.poster{aspect-ratio:16/10;max-width:100%;border-radius:16px;position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#DDEEDB,#CFE5F3)}
.poster .play{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.poster .soon{position:absolute;top:8px;left:8px;font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:#fff;color:var(--muted);padding:3px 8px;border-radius:999px}
.poster .len{position:absolute;bottom:8px;right:8px;font-size:.72rem;font-weight:800;background:rgba(23,48,31,.7);color:#fff;padding:2px 7px;border-radius:6px}
.vid b{font-size:.9rem}
.tips{display:grid;gap:10px;margin-top:14px}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.tip i{width:26px;height:26px;border-radius:8px;background:var(--water-soft);color:var(--water);display:grid;place-items:center;font-style:normal;font-weight:800;flex-shrink:0;font-size:.8rem}

/* leaderboard */
.lb-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.lb-head h1{font-size:clamp(1.8rem,3.6vw,2.5rem)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end;max-width:720px;margin:10px auto 0;width:100%}
.pod{display:grid;justify-items:center;gap:8px;text-align:center}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;position:relative}
.pod .av{width:64px;height:64px;font-size:1.2rem}
.pod.first .av{width:80px;height:80px;font-size:1.45rem}
.av .medal{position:absolute;bottom:-6px;right:-6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;border:3px solid var(--bg);color:#fff;font-weight:800}
.pod .nm{font-weight:800;font-size:.95rem;line-height:1.2}
.pod .val{font-family:var(--f-display);font-size:1.4rem;color:var(--green)}
.block{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:start center;padding-top:10px;font-family:var(--f-display);font-size:2rem;color:rgba(23,48,31,.35);transition:height .5s}
.pod.first .block{background:linear-gradient(180deg,#F4E3B4,#EFD48E);height:140px}
.pod.second .block{background:linear-gradient(180deg,#E6EBEE,#D3DBE0);height:104px}
.pod.third .block{background:linear-gradient(180deg,#F1DECF,#E5C6AD);height:80px}
.pod.me .nm::after{content:" ★";color:var(--green)}
.me-banner{display:flex;gap:14px;align-items:center;background:var(--good-soft);border-radius:18px;padding:14px 18px;flex-wrap:wrap}
.me-banner b{font-family:var(--f-display);font-size:1.4rem;color:var(--green)}
.ranks{display:grid;gap:8px}
.rk{display:grid;grid-template-columns:34px 44px minmax(0,1fr) minmax(0,160px) 70px;gap:12px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rk.me{border-color:var(--green);background:var(--good-soft)}
.rk .n{font-weight:800;color:var(--muted);text-align:center}
.rk .av{width:40px;height:40px;font-size:.85rem}
.rk .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .5s}
.rk .v{font-weight:800;text-align:right}
.rk .chg{font-size:.75rem;font-weight:800}
.up{color:var(--green)} .down{color:var(--bad)} .same{color:var(--muted)}
@media (max-width:620px){.rk{grid-template-columns:28px 40px minmax(0,1fr) 64px}.rk .barcell{display:none}}

/* notifications */
.notif{display:grid;gap:10px;max-width:760px}
.ngroup{font-weight:800;color:var(--muted);font-size:.85rem;margin-top:10px}
.nitem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.nitem .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.nitem .ic svg{width:22px;height:22px}
.nitem b{display:block}
.nitem .tm{font-size:.78rem;color:var(--muted);font-weight:700}
.nitem.new{border-color:var(--water)}

/* savings */
.sv-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px}
@media (max-width:900px){.sv-top{grid-template-columns:1fr}}
.sv-big{font-family:var(--f-display);font-size:3rem;color:var(--green);line-height:1}
.parts{display:grid;gap:12px;margin-top:16px}
.part{display:grid;gap:5px}
.part .row{display:flex;justify-content:space-between;font-size:.9rem}
.part .tr{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.part .tr i{display:block;height:100%;border-radius:5px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.6rem}
.est{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:760px){.est{grid-template-columns:1fr}}
.est .inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.est label{font-size:.82rem;font-weight:700;display:grid;gap:5px}
.est input,.est select{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);width:100%;min-width:0}
.est .out{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.est .out div{background:var(--soft);border-radius:16px;padding:14px}
.est .out b{display:block;font-family:var(--f-display);font-size:1.45rem;color:var(--green)}
footer{border-top:1px solid var(--line);padding-block:22px;font-size:.82rem;color:var(--muted);background:var(--surface)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#dashboard" aria-label="Irriga Tech"><img id="logo1" alt=""><b>IRRIGA <span>TECH</span></b></a>
    <nav class="nav" aria-label="Main">
      <a href="#dashboard" data-r="dashboard" data-i18n="nav_dash"></a>
      <a href="#leaderboard" data-r="leaderboard" data-i18n="nav_lb"></a>
      <a href="#notifications" data-r="notifications"><span class="dot" aria-hidden="true"></span><span data-i18n="nav_nt"></span></a>
      <a href="#savings" data-r="savings" data-i18n="nav_sv"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button id="l-en" aria-pressed="true">EN</button>
      <button id="l-hy" aria-pressed="false">ՀՅ</button>
    </div>
  </div>
</header>

<main class="wrap">

<!-- DASHBOARD -->
<section class="page" id="p-dashboard">
  <div class="hello">
    <div><div class="label" id="dateLine"></div><h1 data-i18n="hello"></h1></div>
    <span class="demo" data-i18n="demo_line"></span>
  </div>
  <div class="dash">
    <div class="col">
      <div class="card scene-card">
        <div class="scene" id="scene">
          <canvas id="cv" aria-label="Field animation"></canvas>
          <div class="tag" id="sceneTag"><i></i><span id="sceneTagT"></span></div>
          <div class="reads" id="sceneReads"></div>
        </div>
        <div class="scene-bar">
          <span class="small muted" data-i18n="scene_q"></span>
          <div class="seg" id="sceneSeg">
            <button data-m="water" aria-pressed="true" data-i18n="sc_today"></button>
            <button data-m="rain" aria-pressed="false" data-i18n="sc_tue"></button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="label" data-i18n="how_plan"></div>
        <div class="flow" style="margin-top:12px">
          <div class="f"><span class="small muted" data-i18n="fl_soil"></span><b class="num">24%</b><span class="small muted" data-i18n="fl_soil_d"></span></div>
          <div class="f"><span class="small muted" data-i18n="fl_wx"></span><b data-i18n="fl_wx_v"></b><span class="small muted" data-i18n="fl_wx_d"></span></div>
          <div class="f"><span class="small muted" data-i18n="fl_crop"></span><b data-i18n="fl_crop_v"></b><span class="small muted" data-i18n="fl_crop_d"></span></div>
          <div class="arrow">→</div>
          <div class="f res"><span class="small muted" data-i18n="fl_plan"></span><b id="flowPlan"></b><span class="small muted" id="flowPlanSub"></span></div>
        </div>
      </div>
      <div class="card chart">
        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div class="label" data-i18n="moist_week"></div><span class="small muted" data-i18n="moist_axis"></span></div>
        <div id="mchart" style="margin-top:10px"></div>
      </div>
    </div>
    <div class="col">
      <div class="card action">
        <div class="label" data-i18n="task_label"></div>
        <h2 id="taskT"></h2>
        <div class="sub" id="taskS"></div>
        <button class="why" id="whyBtn" aria-expanded="false" data-i18n="why"></button>
        <ul id="whyList" hidden><li data-i18n="why1"></li><li data-i18n="why2"></li><li data-i18n="why3"></li></ul>
      </div>
      <div class="card moist">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div class="label" data-i18n="soil_label"></div><span class="pill dry" data-i18n="st_dry"></span></div>
        <div class="big num">24<small>%</small></div>
        <div class="mbars" id="mbars"></div>
        <div class="depths"><div><span class="small muted" data-i18n="d20"></span><br><b class="num">24%</b></div><div><span class="small muted" data-i18n="d40"></span><br><b class="num">29%</b></div></div>
      </div>
      <div class="card">
        <div class="label" data-i18n="wx_label"></div>
        <div class="wx-now" style="margin-top:10px"><span class="t num">17°</span><div class="small"><b id="wxCond"></b><br><span class="muted" data-i18n="wx_meta"></span></div></div>
        <div class="wx-row" id="wxRow"></div>
        <div class="wx-note" data-i18n="wx_note"></div>
        <p class="demo" style="margin-top:8px" data-i18n="wx_sample"></p>
      </div>

const scene = (() => {
  const cv = $('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, raf = 0, plants = [], drops = [], start = performance.now();
  const rnd = (i) => { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); };
  function resize() {
    const w = cv.parentElement.clientWidth; if (!w) return;
    W = w; H = Math.max(260, Math.min(420, Math.round(w * 0.52)));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build(); if (reduced) frame(performance.now());
  }
  function build() {
    plants = []; const N = 9, hy = H * 0.4, vx = W * 0.5;
    for (let r = 0; r < N; r++) {
      const xb = -0.45 * W + r * (1.9 * W / (N - 1));
      let s = 0.98, j = 0;
      while (s > 0.06) { plants.push({r, s, xb, k: r * 50 + j, x: vx + (xb - vx) * s, y: hy + (H - hy) * s}); s *= 0.82; j++; }
    }
    plants.sort((a,b) => a.s - b.s);
    drops = [];
    for (let i = 0; i < 160; i++) drops.push({x: rnd(i+1) * 1.2 - 0.1, y: rnd(i+7), v: 0.9 + rnd(i+3) * 0.6, l: 10 + rnd(i+11) * 14});
  }
  function cloud(x, y, sc, col) {
    ctx.fillStyle = col;
    [[0,0,30,16],[24,-8,26,18],[50,0,30,15],[22,6,34,13]].forEach(e => { ctx.beginPath(); ctx.ellipse(x + e[0]*sc, y + e[1]*sc, e[2]*sc, e[3]*sc, 0, 0, Math.PI*2); ctx.fill(); });
  }
  function frame(now) {
    const tm = (now - start) / 1000, rain = S.mode === 'rain', hy = H * 0.4, vx = W * 0.5;

  $('svChart').innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${t('sv_chart')}">${s}</svg>`;
  $('kpis').innerHTML = [['420 m³','k1'],['-24%','k2'],[amd(67600),'k3']].map(k => `<div class="kpi"><b class="num">${k[0]}</b><span class="small muted">${t(k[1])}</span></div>`).join('');
  const cur = $('eCrop').value || 'tomato';
  $('eCrop').innerHTML = CROPS.map(c => `<option value="${c.id}">${t(c.id)}</option>`).join(''); $('eCrop').value = cur;
  est();
}
function est() {
  const c = CROPS.find(x => x.id === $('eCrop').value) || CROPS[0];
  let a = parseFloat(String($('eArea').value).replace(',', '.')); if (!isFinite(a) || a <= 0) a = 0.1; a = Math.min(a, 50);
  $('ePay').textContent = amd(c.cost * a * 0.5);
  $('eWater').textContent = nf((9573 - 3590) * a) + ' m³';
}
$('eCrop').addEventListener('change', est); $('eArea').addEventListener('input', est);
